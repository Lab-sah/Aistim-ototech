name: OtoApp APK

# Membangun otoapp/ menjadi OtoApp-<versi>.apk dan menaruhnya di release "otoapp-v<versi>" (ditandai prarilis dan bukan "latest",
# supaya pemeriksaan pembaruan extension yang memakai releases/latest tidak terganggu). Jalankan juga manual lewat
# Actions > OtoApp APK > Run workflow. APK juga ditaruh di cabang "otoapp" (OtoApp.apk) untuk unduhan langsung. Naikkan versionName di otoapp/app/build.gradle untuk rilis dengan nomor baru.
# Halaman web di dalam APK diambil dari folder extension/ saat build; di perangkat, aplikasi memperbarui halamannya sendiri
# dari GitHub, jadi perubahan di extension/ tidak perlu membangun APK baru.

on:
  push:
    branches: [main]
    paths:
      - otoapp/**
      - .github/workflows/otoapp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otoapp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bangun APK (release, ditandatangani dengan otoapp/ototech.keystore)
        run: |
          set -o pipefail
          gradle -p otoapp assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Tampilkan galat build
        if: failure()
        run: |
          # Potongan akhir log ditampilkan sebagai anotasi supaya bisa dibaca tanpa membuka log lengkap
          { grep -A14 "What went wrong" build.log; grep -E "error:|error: " build.log; } | head -n 45 > galat.txt
          [ -s galat.txt ] || tail -n 45 build.log > galat.txt
          MSG=$(python3 -c "import sys;print(open('galat.txt',errors='replace').read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
          echo "::error title=Galat build::$MSG"

      - name: Siapkan berkas APK
        run: |
          VERSION=$(grep -oP "versionName\s*=?\s*'\K[^']+" otoapp/app/build.gradle)
          APK="OtoApp-$VERSION.apk"
          cp otoapp/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"

      - name: Buat atau perbarui release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="otoapp-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "OtoApp v$VERSION" \
              --notes "Unduh **$APK** dan pasang di Android (izinkan pemasangan dari sumber ini). Halaman di dalam aplikasi diperbarui otomatis dari GitHub." \
              --prerelease --latest=false \
              || gh release upload "$TAG" "$APK" --clobber
          fi

      # Cabang "otoapp" hanya berisi APK terbaru (OtoApp.apk) dan README singkat. Dibuat ulang sebagai satu commit setiap build
      # (push paksa), jadi riwayat repo tidak membengkak oleh berkas biner. Link unduh tetap:
      # https://github.com/<pemilik>/<repo>/raw/otoapp/OtoApp.apk
      - name: Taruh APK di cabang otoapp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="$RUNNER_TEMP/cabang-otoapp"
          rm -rf "$D" && mkdir -p "$D"
          cp "$APK" "$D/OtoApp.apk"
          {
            echo "# OtoApp"
            echo
            echo "APK terbaru: **OtoApp.apk** (v$VERSION, build #${{ github.run_number }})."
            echo
            echo "Unduh langsung: https://github.com/${{ github.repository }}/raw/otoapp/OtoApp.apk"
            echo
            echo "Kode sumber ada di folder otoapp/ cabang main."
          } > "$D/README.md"
          cd "$D"
          git init -q -b otoapp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "OtoApp v$VERSION (build #${{ github.run_number }})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin otoapp
